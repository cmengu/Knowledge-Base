[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-kb"
version = "0.1.0"
description = "YouTube AI-topic knowledge-base pipeline — Layer 1 ingest"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "youtube-transcript-api>=1.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kb-ingest = "kb.ingest.__main__:main"

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
